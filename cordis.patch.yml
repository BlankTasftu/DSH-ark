# ============================================================================
# dsh-ark —— DSH bundle patch
# ============================================================================
# 把火山方舟能力插件挂进 profile 配置树。DSH 启动时按 bundle 层栈叠加各插件
# patch，本文件负责把 dsh-ark 这一行插进去。
#
# 安装（本地开发）：
#   dsh plugin --profile desktop add <本目录绝对路径>
# 卸载：
#   dsh plugin --profile desktop remove dsh-ark
#
# 非敏感配置写在下面这一行的 config 块里（页面保存也写这里，是唯一存储）；
# 密钥一律走 DSH 凭据服务（ctx.credentials），不落在本文件。
# ============================================================================

- insert:
    - id: dsh-ark
      name: dsh-ark
      config:
        # —— Ark（方舟数据面）——
        ark:
          baseUrl: https://ark.cn-beijing.volces.com/api/v3
          # 凭据名（DSH credentials 里的 key），不是密钥本身
          credential: ARK_API_KEY
          # ⚠️ 模型 ID 必须选"当前在售"的版本化 ID：已 Retiring/Shutdown 的 ID 会返回
          # HTTP 404 InvalidEndpointOrModel.NotFound（与"没开通"报错相同，极易误判）。
          # 换之前先用 GET /api/v3/models 确认 status。以下两个已在本机账号实测可用。
          imageModel: doubao-seedream-5-0-pro-260628
          videoModel: doubao-seedance-2-0-260128
          requestTimeoutMs: 300000
          rateLimitRetries: 2
          rateLimitBackoffMs: 25000
        # —— 火山「语音技术」通道（TTS / ASR / 音频生成）——
        speech:
          # 传输形式：sse 单向流式（默认） | ndjson 逐行流式
          mode: sse
          baseUrl: https://openspeech.bytedance.com/api/v3
          # 鉴权只有一条路：API Key（只发 X-Api-Key）。
          # App ID 是"请求/应用配置"而非鉴权因子；旧版 App ID + Access Token 已不再支持。
          apiKeyCredential: VOLCENGINE_SPEECH_API_KEY
          resourceTts: seed-tts-2.0
          resourceTtsClone: seed-icl-2.0
          # ⚠️ 不要凭"代"推测资源 id。曾有一个 `resourceTtsV1: volc.service_type.10029`
          # 是照"1.0 代音色"的假设加的 —— 实测该资源**并不存在**（用已确认可用的
          # 2.0 音色去配它照样 not granted），已删除，否则只会把"音色不配套"这一
          # 准确错误变成误导性的"资源未授权"。
          # 另：SeedAudio 音频生成走 model=seed-audio-1.0，与本节的资源 id 无关。
          resourceAsr: volc.seedasr.sauc.duration
          voice: zh_female_shuangkuaisisi_uranus_bigtts
          format: mp3
          sampleRate: 24000
          # 单次请求文本上限（超出按标点分句后串行合成再拼接）
          maxCharsPerRequest: 200
        # —— 产物落盘与预览 ——
        output:
          dir: ark-output
          previewRoute: true
